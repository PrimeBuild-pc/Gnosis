# Copy as config/sources.toml. Use stable IDs, not display names.
# These examples are deliberately disabled: templates, not real IDs.
# The quickest way to add real sources is the dashboard's Sources tab.
#
# workspace: groups sources from the same server. When querying Gnosis with that
# context selected, answers cite only its sources instead of mixing everything.
# Empty or absent = the source remains visible only in the global context.

[[telegram]]
chat_id = "-1001234567890"
name = "AI Community"
enabled = false
topics = ["AI", "security", "software"]
workspace = "Personal Telegram"

[[discord]]
channel_id = "123456789012345678"
name = "security"
enabled = false
topics = ["security"]
workspace = "My server"

[[reddit]]
subreddit = "MachineLearning"
name = "r/MachineLearning"
enabled = false
topics = ["AI", "research"]
