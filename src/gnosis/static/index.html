<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gnosis — Prime Build</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Guscio applicativo: barra dei bot e delle sezioni a sinistra, contesto (server) in
       alto, e un solo contenitore in cui il modulo attivo si disegna. Nessun contenuto
       specifico di Gnosis vive qui dentro: lo iniettano i moduli. -->
  <div class="app">
    <div class="brand">
      <span class="brand-mark" id="brand-mark">🧠</span>
      <span class="brand-name" id="brand-name">Gnosis</span>
    </div>

    <div class="topbar">
      <div class="server-picker">
        <span data-i18n="workspace.label"></span>
        <select id="workspace-select"></select>
      </div>
      <span class="topbar-spacer"></span>
      <select id="language-select" aria-label="Language"></select>
    </div>

    <nav class="rail" id="rail"></nav>

    <main class="main">
      <div class="module" id="module"></div>
    </main>
  </div>

  <script src="/i18n.js" defer></script>
  <script src="/ui.js" defer></script>
  <script src="/modules.js" defer></script>
  <script src="/shell.js" defer></script>
</body>
</html>
