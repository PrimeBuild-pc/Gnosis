<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gnosis — Prime Build</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <!-- Shared shell: bot navigation on the left, context above and one active module. -->
  <div class="app">
    <div class="brand">
      <span class="brand-mark" id="brand-mark">🧠</span>
      <span class="brand-name" id="brand-name">Gnosis</span>
    </div>

    <div class="topbar">
      <div class="server-picker">
        <label for="workspace-select" data-i18n="workspace.label"></label>
        <select id="workspace-select"></select>
      </div>
      <span class="topbar-spacer"></span>
      <select id="language-select" aria-label="Language" data-i18n-aria-label="language.label"></select>
    </div>

    <nav class="rail" id="rail"></nav>

    <main class="main" id="main" tabindex="-1">
      <div class="module" id="module"></div>
    </main>
  </div>

  <script src="/i18n.js" defer></script>
  <script src="/ui.js" defer></script>
  <script src="/modules.js" defer></script>
  <script src="/shell.js" defer></script>
</body>
</html>
