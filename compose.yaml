services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: gnosis
      POSTGRES_USER: gnosis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gnosis}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnosis"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/primebuild-pc/gnosis:latest
    build: .
    env_file: .env
    environment:
      GNOSIS_HOST: 0.0.0.0
      GNOSIS_PORT: 8080
    command: ["gnosis", "web"]
    ports:
      - "127.0.0.1:${GNOSIS_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro

  worker:
    image: ghcr.io/primebuild-pc/gnosis:latest
    build: .
    env_file: .env
    command: ["gnosis", "worker"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
      - telegram-data:/data/telegram

volumes:
  postgres-data:
  telegram-data:
